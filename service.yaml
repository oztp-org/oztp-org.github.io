apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: oztp-zeta-service
  labels:
    cloud.googleapis.com/location: us-east1
    managed-by: github-actions-wif
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      serviceAccountName: oztp-runtime-sa@oztp-control-platform.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - name: oztp-zeta-container
          image: us-east1-docker.pkg.dev/oztp-control-platform/oztp-containers/oztp-zeta:PLACEHOLDER
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "oztp-control-platform"
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            runAsUser: 65532
